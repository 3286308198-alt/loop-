name: Build Loop iOS Only
on:
  push:
    branches: [ dev ]
jobs:
  build:
    runs-on: macos-latest
    env:
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    steps:
      - uses: actions/checkout@v4

      - name: 配置Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 归档打包
        run: |
          mkdir -p ./build
          xcodebuild archive \
            -project Loop.xcodeproj \
            -scheme Loop \
            -destination generic/platform=iOS \
            -archivePath ./build/Loop.xcarchive

      - name: 导出无签名IPA
        run: |
          mkdir -p ./ipa
          xcodebuild -exportArchive \
            -archivePath ./build/Loop.xcarchive \
            -exportPath ./ipa \
            -exportOptionsPlist <(echo '{"method":"development","signingStyle":"manual","stripSwiftSymbols":true}')

      - name: 上传IPA安装包
        uses: actions/upload-artifact@v4
        with:
          name: Loop-无签名IPA
          path: ./ipa/*.ipa
