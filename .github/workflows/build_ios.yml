name: Build Loop iOS Only
on:
  push:
    branches: [ dev ]
jobs:
  build:
    runs-on: macos-latest
    env:
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEVELOPMENT_TEAM: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive Project
        run: |
          mkdir -p ./build
          xcodebuild archive \
            -workspace Loop.xcworkspace \
            -scheme Loop \
            -archivePath ./build/Loop.xcarchive

      - name: Export Unsigned IPA
        run: |
          mkdir -p ./ipa
          xcodebuild -exportArchive \
            -archivePath ./build/Loop.xcarchive \
            -exportPath ./ipa \
            -exportOptionsPlist <(echo '{"method":"development","signingStyle":"manual","teamID":null}')

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loop-IPA
          path: ./ipa/*.ipa
